services:
  postgres:
    image: postgres:17-alpine
    container_name: bewerbungsmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bewerbungsmanager}
      POSTGRES_USER: ${POSTGRES_USER:-bewerbungsmanager}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-bewerbungsmanager} -d $${POSTGRES_DB:-bewerbungsmanager}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
